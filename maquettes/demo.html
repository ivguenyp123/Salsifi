<html lang=&quot;fr&quot; data-theme=&quot;dark&quot;>

<style>
:root{
  --bg-deep:#0f0a1f; --bg-card:rgba(28,20,50,.55); --bg-card-h:rgba(40,28,70,.7);
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
  --tp:#f5f1ff; --ts:#b8aed8; --tm:#7a6fa3;
  --accent:#a78bfa; --deliver:#2dd4bf; --info:#60a5fa; --warn:#fbbf24; --err:#f87171; --ok:#34d399;
  --fd:'Bricolage Grotesque',system-ui,sans-serif; --fb:'Manrope',system-ui,sans-serif; --fm:ui-monospace,'SF Mono',Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--fb);background:var(--bg-deep);color:var(--tp);min-height:100vh;overflow-x:hidden;padding:0 0 70px}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(60% 50% at 10% 0%,rgba(124,92,252,.16),transparent),radial-gradient(50% 40% at 92% 6%,rgba(45,212,191,.10),transparent)}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px;position:relative;z-index:1}
header{display:flex;align-items:center;gap:15px;padding:24px 0 6px;flex-wrap:wrap}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--deliver));display:grid;place-items:center;font-size:24px}
header h1{font-family:var(--fd);font-size:23px;font-weight:800;letter-spacing:-.02em}
header .sub{font-size:12.5px;color:var(--ts);margin-top:1px}
.ctx-pill{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--bg-card);border:1px solid var(--line);border-radius:12px;padding:8px 13px;font-size:12px;color:var(--ts)}
.ctx-pill b{color:var(--tp)}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 2px;font-size:12.5px}
.nav a{color:var(--ts);text-decoration:none;background:var(--bg-card);border:1px solid var(--line);border-radius:20px;padding:6px 13px}
.nav a.on{color:var(--tp);border-color:var(--accent);background:rgba(124,92,252,.12)}

/* HERO */
.hero{margin:16px 0 8px;border:1px solid var(--line2);border-radius:20px;background:linear-gradient(180deg,rgba(124,92,252,.09),rgba(45,212,191,.03));padding:22px 26px}
.hero h2{font-family:var(--fd);font-size:20px;font-weight:800;margin-bottom:4px}
.hero p{font-size:13px;color:var(--ts);margin-bottom:15px;max-width:780px}
.hero p .rk{color:var(--deliver);font-weight:700} .hero p .pk{color:var(--accent);font-weight:700}
.ask{display:flex;gap:10px;flex-wrap:wrap}
.ask input{flex:1;min-width:260px;font-family:var(--fb);font-size:15px;color:var(--tp);background:rgba(10,7,22,.6);border:1px solid var(--line2);border-radius:13px;padding:13px 16px;outline:none}
.ask input:focus{border-color:var(--accent)}
.ask button{font-family:var(--fb);font-weight:800;font-size:14px;color:#0f0a1f;background:linear-gradient(135deg,var(--accent),var(--deliver));border:none;border-radius:13px;padding:13px 20px;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{font-size:12px;color:var(--ts);background:var(--bg-card);border:1px solid var(--line);border-radius:20px;padding:6px 12px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--accent);color:var(--tp)}
#intentResult{margin-top:16px}

/* Toolbar — le toggle est la clé */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 14px}
.kindseg{display:flex;gap:4px;background:var(--bg-card);border:1px solid var(--line2);border-radius:13px;padding:5px}
.kindseg button{font-family:var(--fb);font-size:13px;font-weight:800;color:var(--ts);background:transparent;border:none;border-radius:10px;padding:9px 15px;cursor:pointer;transition:.15s}
.kindseg button[data-k=&quot;recipe&quot;].on{background:rgba(45,212,191,.18);color:var(--deliver)}
.kindseg button[data-k=&quot;prompt&quot;].on{background:rgba(124,92,252,.2);color:var(--accent)}
.kindseg button[data-k=&quot;&quot;].on{background:rgba(255,255,255,.08);color:var(--tp)}
.tagbar{display:flex;gap:7px;flex-wrap:wrap}
.tag{font-size:11.5px;color:var(--ts);background:var(--bg-card);border:1px solid var(--line);border-radius:20px;padding:5px 11px;cursor:pointer}
.tag.on{border-color:var(--accent);color:var(--accent);background:rgba(124,92,252,.12)}
.filts{margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ck{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ts);cursor:pointer}
.ck input{width:16px;height:16px;accent-color:var(--accent)}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:16px;background:var(--bg-card);padding:16px 18px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:10px;position:relative}
.card:hover{border-color:var(--line2);background:var(--bg-card-h);transform:translateY(-2px)}
.card.recipe{border-left:3px solid rgba(45,212,191,.5)}
.card.prompt{border-left:3px solid rgba(124,92,252,.5)}
.card .top{display:flex;align-items:flex-start;gap:10px}
.card .ic{font-size:22px}
.card .ti{font-family:var(--fd);font-weight:800;font-size:15px;line-height:1.25;flex:1}
.kindbadge{font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:6px;white-space:nowrap}
.kindbadge.recipe{color:var(--deliver);background:rgba(45,212,191,.12);border:1px solid rgba(45,212,191,.3)}
.kindbadge.prompt{color:var(--accent);background:rgba(124,92,252,.12);border:1px solid rgba(124,92,252,.3)}
.lvl{font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:20px;white-space:nowrap}
.lvl.off,.lvl.official{color:var(--ok);background:rgba(52,211,153,.14);border:1px solid rgba(52,211,153,.35)}
.lvl.team{color:var(--info);background:rgba(96,165,250,.14);border:1px solid rgba(96,165,250,.35)}
.lvl.exp{color:var(--warn);background:rgba(251,191,36,.12);border:1px dashed rgba(251,191,36,.5)}
.lvl.mine{color:var(--accent);background:rgba(124,92,252,.14);border:1px solid rgba(124,92,252,.35)}
.card .desc{font-size:12.5px;color:var(--ts);line-height:1.5}
.card .tags{display:flex;gap:5px;flex-wrap:wrap}
.card .tags span{font-size:10.5px;color:var(--tm);background:rgba(255,255,255,.04);border-radius:6px;padding:2px 7px}
.snippet{font-family:var(--fm);font-size:11px;color:var(--tm);background:rgba(10,7,22,.5);border:1px solid var(--line);border-radius:9px;padding:8px 10px;line-height:1.5;max-height:52px;overflow:hidden}
.snippet .v{color:var(--deliver)}
.metrics{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ts);border-top:1px solid var(--line);padding-top:10px}
.metrics b{color:var(--tp);font-size:13px;font-weight:800}
.metrics .m{display:flex;flex-direction:column}
.foot{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--tm);border-top:1px solid var(--line);padding-top:9px}
.star{all:unset;cursor:pointer;font-size:15px;line-height:1;opacity:.4;transition:.15s}.star.on{opacity:1}
.act{margin-left:auto;font-family:var(--fb);font-weight:800;font-size:12px;color:#0f0a1f;border:none;border-radius:9px;padding:7px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.act.run{background:linear-gradient(135deg,#2dd4bf,#34d399)}
.act.copy{background:linear-gradient(135deg,var(--accent),#c4b5fd)}
.varpill{font-size:10px;color:var(--deliver);border:1px solid rgba(45,212,191,.4);border-radius:20px;padding:2px 8px}
.autopill{font-size:10px;color:var(--info);border:1px solid rgba(96,165,250,.4);background:rgba(96,165,250,.08);border-radius:20px;padding:2px 8px}
.agentic{font-size:10px;color:var(--deliver);border:1px solid rgba(45,212,191,.4);border-radius:20px;padding:2px 8px}
/* contexte injecté + conventions */
.ctxbn{border:1px solid rgba(96,165,250,.35);background:rgba(96,165,250,.07);border-radius:12px;padding:11px 14px;margin-top:12px;font-size:12.5px;color:var(--ts);line-height:1.5}
.ctxbn b{color:var(--tp)}
.ctxbn .srcs{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.src{font-size:10.5px;color:var(--info);background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.3);border-radius:6px;padding:2px 7px;font-family:var(--fm)}
.varrow.filled input,.varrow.filled textarea{border-color:rgba(96,165,250,.45);background:rgba(96,165,250,.05)}
.vtag{font-size:10px;color:var(--info);margin-left:7px;font-weight:600}
.conv{display:flex;gap:6px;flex-wrap:wrap}
.conv span{font-size:11px;color:var(--deliver);background:rgba(45,212,191,.08);border:1px solid rgba(45,212,191,.28);border-radius:7px;padding:3px 9px}
.cmp{margin-top:11px;border-top:1px solid var(--line);padding-top:10px}
.cmp summary{cursor:pointer;font-size:12px;color:var(--ts);font-weight:700;list-style:none}
.cmp summary::-webkit-details-marker{display:none}
.cmp summary::before{content:'▸ ';color:var(--tm)}
.cmp[open] summary::before{content:'▾ '}
.rawbox{font-family:var(--fm);font-size:12px;color:var(--tm);background:rgba(248,113,113,.04);border:1px solid rgba(248,113,113,.22);border-radius:10px;padding:11px 13px;line-height:1.6;white-space:pre-wrap;margin-top:9px}
.delta{font-size:11.5px;color:var(--warn);margin-top:8px;line-height:1.5}
/* diff + preuve (continuité prompt→recette) */
.hunk{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:9px;background:rgba(10,7,22,.5)}
.hwhy{font-size:11.5px;color:var(--ts);padding:7px 11px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
.dl{font-family:var(--fm);font-size:11.5px;padding:2px 11px;white-space:pre-wrap;word-break:break-word;line-height:1.55}
.dl.del{color:#f6a5a5;background:rgba(248,113,113,.08)}
.dl.add{color:#7ee6c9;background:rgba(45,212,191,.08)}
.proof{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px;color:var(--ts);align-items:baseline}
.proof .pl2{color:var(--tm);font-weight:700;white-space:nowrap}
.proof b{color:var(--tp)}

/* Modal */
.ov{position:fixed;inset:0;z-index:60;background:rgba(6,4,14,.74);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.ov.show{display:flex}
.modal{width:100%;max-width:680px;background:#160f2b;border:1px solid var(--line2);border-radius:20px;padding:22px 24px}
.modal .mh{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
.modal .mh .ic{font-size:26px}
.modal h3{font-family:var(--fd);font-size:19px;font-weight:800;flex:1}
.x{all:unset;cursor:pointer;font-size:20px;color:var(--tm)}
.field{border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02);padding:12px 14px;margin-top:12px}
.field .fl{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.field .fv{font-size:13px;color:var(--ts);line-height:1.55}
.field .fv b{color:var(--tp)}
.promptbox{font-family:var(--fm);font-size:12.5px;color:var(--tp);background:rgba(10,7,22,.6);border:1px solid var(--line);border-radius:10px;padding:13px 15px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.promptbox .v{color:var(--deliver);background:rgba(45,212,191,.1);border-radius:4px;padding:0 3px}
.varform{display:grid;gap:9px;margin-top:4px}
.varrow{display:flex;flex-direction:column;gap:4px}
.varrow label{font-size:11px;color:var(--ts);font-weight:700}
.varrow input,.varrow textarea{font-family:var(--fb);font-size:13px;color:var(--tp);background:rgba(10,7,22,.6);border:1px solid var(--line2);border-radius:9px;padding:9px 11px;outline:none;resize:vertical}
.varrow input:focus,.varrow textarea:focus{border-color:var(--accent)}
.tool{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:8px;padding:4px 9px;margin:3px 4px 0 0}
.tool.read{color:var(--ts);background:rgba(255,255,255,.05);border:1px solid var(--line)}
.tool.write{color:var(--warn);background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3)}
.chk{display:flex;align-items:center;gap:10px;font-size:13px;padding:7px 0;border-top:1px solid var(--line)}
.mbtns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center}
.mbtn{font-family:var(--fb);font-weight:800;font-size:13px;border-radius:11px;padding:11px 18px;cursor:pointer;border:none}
.mbtn.go{color:#0f0a1f;background:linear-gradient(135deg,var(--accent),var(--deliver))}
.mbtn.run{color:#0f0a1f;background:linear-gradient(135deg,#2dd4bf,#34d399)}
.mbtn.ghost{color:var(--ts);background:rgba(255,255,255,.05);border:1px solid var(--line2)}
.mbtn.mini{padding:8px 12px;font-size:12px}
.note{font-size:11px;color:var(--tm);margin-top:12px;line-height:1.5}
.thumbs{display:flex;gap:8px;margin-left:auto}
.thumb{all:unset;cursor:pointer;font-size:16px;padding:4px 8px;border-radius:8px;border:1px solid var(--line)}
.empty{color:var(--tm);font-size:13px;text-align:center;padding:30px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:99;background:rgba(40,28,70,.97);color:var(--tp);font-weight:700;font-size:13px;padding:11px 18px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.4);opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class=&quot;wrap&quot;>
  <header>
    <div class=&quot;logo&quot;>🧰</div>
    <div>
      <h1>Catalogue IA</h1>
      <div class=&quot;sub&quot;>Recettes &amp;amp; prompts au même endroit · le LLM oriente, les outils déterministes exécutent</div>
    </div>
    <div class=&quot;ctx-pill&quot;>📦 <b>platformengineering</b> · Java 21 · Spring · Kubernetes · GitLab CI</div>
  </header>

  <div class=&quot;nav&quot;>
    <a href=&quot;#&quot; class=&quot;on&quot;>🧰 Catalogue</a>
    <a href=&quot;#&quot; data-go=&quot;studio&quot;>🛠️ Studio</a>
    <a href=&quot;#&quot; data-go=&quot;metrics&quot;>📊 Métriques</a>
  </div>

  <!-- HERO -->
  <div class=&quot;hero&quot;>
    <h2>Que veux-tu faire ?</h2>
    <p>Décris ton besoin, tu <b>Lances</b>. Une <span class=&quot;rk&quot;>🍳 recette</span> lance un <b>workflow</b> (outils, écritures, garde-fous) qui agit sur ton dépôt ; un <span class=&quot;pk&quot;>📚 prompt</span> lance une <b>génération</b> déjà <b>pré-remplie depuis ton contexte</b> (fichier ouvert, pipeline cassé, MR) et à <b>tes conventions maison</b> — donc plus rapide et plus juste qu'un chat nu, pas plus lent.</p>
    <div class=&quot;ask&quot;>
      <input id=&quot;ask&quot; placeholder=&quot;ex : générer des tests · préparer la livraison · expliquer ce code…&quot; autocomplete=&quot;off&quot;>
      <button id=&quot;askGo&quot;>Trouver →</button>
    </div>
    <div class=&quot;chips&quot; id=&quot;chips&quot;></div>
    <div id=&quot;intentResult&quot;></div>
  </div>

  <!-- TOOLBAR -->
  <div class=&quot;toolbar&quot;>
    <div class=&quot;kindseg&quot; id=&quot;kindSeg&quot;>
      <button data-k=&quot;&quot; class=&quot;on&quot;>Tout</button>
      <button data-k=&quot;recipe&quot;>🍳 Recettes · agir</button>
      <button data-k=&quot;prompt&quot;>📚 Prompts · générer</button>
    </div>
    <div class=&quot;tagbar&quot; id=&quot;tagbar&quot;></div>
    <div class=&quot;filts&quot;>
      <label class=&quot;ck&quot;><input type=&quot;checkbox&quot; id=&quot;ctxOnly&quot; checked> Compatibles avec mon dépôt</label>
      <label class=&quot;ck&quot;><input type=&quot;checkbox&quot; id=&quot;favOnly&quot;> ⭐ Favoris</label>
    </div>
  </div>

  <div class=&quot;grid&quot; id=&quot;grid&quot;></div>
</div>

<div class=&quot;ov&quot; id=&quot;ov&quot;><div class=&quot;modal&quot; id=&quot;modal&quot;></div></div>
<div class=&quot;toast&quot; id=&quot;toast&quot;></div>

<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  function esc(s){return String(s==null?'':s).replace(/&amp;/g,'&amp;amp;').replace(/</g,'&amp;lt;').replace(/>/g,'&amp;gt;');}
  function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._x); t._x=setTimeout(function(){t.classList.remove('show');},2200); }
  function copy(text){ if(navigator.clipboard&amp;&amp;navigator.clipboard.writeText){navigator.clipboard.writeText(text).catch(function(){fb(text);});}else fb(text); }
  function fb(text){ var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
  function vars(b){ var m,re=/\{\{\s*([\wÀ-ÿ][\wÀ-ÿ .-]*?)\s*\}\}/g,s=[]; while((m=re.exec(b))){var n=m[1].trim(); if(s.indexOf(n)===-1)s.push(n);} return s; }
  function hl(b){ return esc(b).replace(/\{\{\s*([\wÀ-ÿ][\wÀ-ÿ .-]*?)\s*\}\}/g,'<span class=&quot;v&quot;>{{$1}}</span>'); }
  function fill(b,v){ return b.replace(/\{\{\s*([\wÀ-ÿ][\wÀ-ÿ .-]*?)\s*\}\}/g,function(m,n){var x=v[n.trim()];return (x!==undefined&amp;&amp;x!=='')?x:m;}); }

  var CTX={ repo:'platformengineering', stack:['java','spring','kubernetes','java21'] };
  var LVL_LABEL={off:'Officiel',team:'Équipe',exp:'Expérimental',official:'Officiel',mine:'Perso'};
  var LVL_ICON={off:'🛡',team:'👥',exp:'🧪',official:'🟢',mine:'👤'};

  // ═══════════════════════════════════════════════════════════════
  //  MOTEURS RÉELS (maquette qui marche pour de vrai, pas de canned)
  //  → calculés côté client à partir du code que tu colles.
  // ═══════════════════════════════════════════════════════════════
  function detectLang(c){
    if(/import java|System\.out|@Override|@Test/.test(c)) return 'java';
    if(/\b(public|private|protected)\b/.test(c) &amp;&amp; /;\s*$/m.test(c)) return 'java';
    if(/\bdef\s+\w+\s*\(|^\s*print\s*\(/m.test(c)) return 'python';
    if(/\bfunction\b|=>|\b(const|let)\b|console\.log|\bexport\b/.test(c)) return 'js';
    if(/;\s*$/m.test(c) &amp;&amp; /\)\s*\{/.test(c)) return 'java';
    return 'js';
  }
  function extractFns(c,lang){
    var out=[],m,re;
    if(lang==='java'){ re=/(?:public|private|protected|static|final|\s)+[\w<>\[\],\s]+?\s+(\w+)\s*\(([^)]*)\)\s*\{/g; }
    else if(lang==='python'){ re=/def\s+(\w+)\s*\(([^)]*)\)/g; }
    else { re=/(?:function\s+(\w+)|(?:const|let|var)\s+(\w+)\s*=\s*(?:async\s*)?\([^)]*\)\s*=>|(\w+)\s*\(([^)]*)\)\s*\{)/g; }
    var seen={};
    while((m=re.exec(c))){ var n=m[1]||m[2]||m[3]; if(n &amp;&amp; !seen[n] &amp;&amp; !/^(if|for|while|switch|catch|return|function)$/.test(n)){ seen[n]=1; out.push({name:n,args:(m[2]||m[4]||'').trim()}); } }
    return out;
  }
  function analyzeCode(code){
    code=code||'';
    var lines=code.split('\n'), lang=detectLang(code);
    var loc=lines.filter(function(l){return l.trim() &amp;&amp; !/^\s*(\/\/|#|\*)/.test(l);}).length;
    var fns=extractFns(code,lang);
    var F=[]; // findings {sev,line,msg}
    lines.forEach(function(l,i){
      var n=i+1, t=l.trim();
      if(/\b(TODO|FIXME|XXX)\b/.test(l)) F.push({sev:'y',line:n,msg:'Marqueur '+(l.match(/TODO|FIXME|XXX/)[0])+' laissé dans le code'});
      if(/console\.log|System\.out\.print|\bprint\s*\(/.test(l)) F.push({sev:'y',line:n,msg:'Trace de debug à retirer'});
      if(/\.\w+\(\)\.\w+\(\)\.\w+\(/.test(l)) F.push({sev:'r',line:n,msg:'Chaîne d\'appels — risque de NullPointerException (loi de Déméter)'});
      if(/\breturn\s+null\s*;?\s*$/.test(l)) F.push({sev:'y',line:n,msg:'Retourne null — préférer Optional/exception'});
      if(/catch\s*\([^)]*\)\s*\{\s*$/.test(l) &amp;&amp; (lines[i+1]||'').trim()==='}' ) F.push({sev:'r',line:n,msg:'Bloc catch vide — erreur avalée'});
      if(/[^=!<>]==[^=]/.test(l) &amp;&amp; lang==='js') F.push({sev:'y',line:n,msg:'Égalité faible == — préférer ==='});
      if(/\bnew\s+\w*\(?\s*\d{2,}\b|\*\s*\d{2,}\b|\bmultiply\(new \w+\(\d+/.test(l)) F.push({sev:'y',line:n,msg:'Nombre magique — extraire une constante nommée'});
      if(l.length>120) F.push({sev:'g',line:n,msg:'Ligne longue ('+l.length+' car.)'});
    });
    var depth=0,maxd=0; for(var i=0;i<code.length;i++){ if(code[i]==='{'){depth++;maxd=Math.max(maxd,depth);} else if(code[i]==='}')depth--; }
    if(maxd>=4) F.push({sev:'y',line:0,msg:'Imbrication profonde ('+maxd+' niveaux) — extraire des méthodes'});
    if(fns.length &amp;&amp; !/@Test|\btest\w*\(|it\(|describe\(|def test_/.test(code)) F.push({sev:'g',line:0,msg:'Aucun test détecté pour '+fns.length+' fonction'+(fns.length>1?'s':'')});
    var r=F.filter(function(x){return x.sev==='r';}).length, y=F.filter(function(x){return x.sev==='y';}).length, g=F.filter(function(x){return x.sev==='g';}).length;
    var score=Math.max(0,100-r*20-y*8-g*3);
    var SEV={r:['🔴','var(--err)'],y:['🟡','var(--warn)'],g:['🟢','var(--ok)']};
    var html='<div style=&quot;display:flex;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap&quot;>'+
      '<div style=&quot;font-family:var(--fd);font-size:26px;font-weight:800;color:'+(score>=80?'var(--ok)':score>=55?'var(--warn)':'var(--err)')+'&quot;>'+score+'<span style=&quot;font-size:14px;color:var(--tm)&quot;>/100</span></div>'+
      '<div style=&quot;font-size:12px;color:var(--ts)&quot;>'+lang.toUpperCase()+' · '+loc+' LOC · '+fns.length+' fonction'+(fns.length>1?'s':'')+' · <span style=&quot;color:var(--err)&quot;>'+r+' 🔴</span> <span style=&quot;color:var(--warn)&quot;>'+y+' 🟡</span> <span style=&quot;color:var(--ok)&quot;>'+g+' 🟢</span></div></div>';
    if(!code.trim()) html='<div style=&quot;color:var(--tm)&quot;>Colle du code dans {{code}} pour lancer l\'analyse.</div>';
    else if(!F.length) html+='<div style=&quot;color:var(--ok)&quot;>✅ Aucun problème détecté par les règles de la plateforme.</div>';
    else html+=F.sort(function(a,b){return ('ryg'.indexOf(a.sev))-('ryg'.indexOf(b.sev));}).map(function(f){
      return '<div style=&quot;display:flex;gap:9px;padding:6px 0;border-top:1px solid var(--line);font-size:12.5px&quot;><span>'+SEV[f.sev][0]+'</span>'+
        (f.line?'<span style=&quot;font-family:var(--fm);color:var(--tm);min-width:34px&quot;>L'+f.line+'</span>':'<span style=&quot;min-width:34px&quot;></span>')+
        '<span style=&quot;color:var(--ts)&quot;>'+esc(f.msg)+'</span></div>';
    }).join('');
    var text='Analyse ('+lang+') — score '+score+'/100 · '+loc+' LOC · '+fns.length+' fonctions\n'+
      F.map(function(f){return (f.sev==='r'?'[BLOQUANT]':f.sev==='y'?'[ATTENTION]':'[INFO]')+(f.line?' L'+f.line:'')+' — '+f.msg;}).join('\n');
    return {html:html, text:text, score:score, r:r, y:y, g:g, total:F.length, lang:lang, fns:fns.length};
  }
  function genTests(code){
    code=code||''; var lang=detectLang(code), fns=extractFns(code,lang);
    if(!fns.length) return {text:'// Aucune fonction détectée dans le code fourni.', name:'—', lang:lang};
    var cls=(code.match(/class\s+(\w+)/)||[])[1] || 'Unit';
    var out,name;
    if(lang==='java'){
      name=cls+'Test.java';
      out='import org.junit.jupiter.api.Test;\nimport static org.assertj.core.api.Assertions.*;\n\nclass '+cls+'Test {\n\n'+

.addline{display:flex;gap:8px;margin-top:9px}
.addline input{flex:1}
.addline button{font-family:var(--fb);font-weight:700;font-size:12px;color:var(--ts);background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:9px;padding:0 13px;cursor:pointer}
.mini{font-size:11px;color:var(--tm);margin-top:9px;line-height:1.5}

/* right rail */
.gov .step{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--tm);padding:5px 0}
.gov .step.done{color:var(--ok)} .gov .step.cur{color:var(--tp);font-weight:700}
.gov .dot{width:9px;height:9px;border-radius:50%;background:var(--line2)}
.gov .step.done .dot{background:var(--ok)} .gov .step.cur .dot{background:var(--warn)}
.govbtns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.gb{font-family:var(--fb);font-weight:800;font-size:13px;border-radius:10px;padding:11px 14px;cursor:pointer;border:none;text-align:center}
.gb.go{color:#0f0a1f;background:linear-gradient(135deg,var(--accent),var(--deliver))}
.gb.warn{color:var(--warn);background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.35)}
.gb.ghost{color:var(--ts);background:rgba(255,255,255,.05);border:1px solid var(--line2)}
.metric{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ts);padding:6px 0;border-top:1px solid var(--line)}
.metric:first-of-type{border-top:none}
.metric b{color:var(--tp)}
.ver{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ts);padding:7px 0;border-top:1px solid var(--line)}
.ver:first-of-type{border-top:none}
.ver .vn{font-family:var(--fm);color:var(--tp);font-weight:700}
.ver .vd{color:var(--tm)}
.ver .rb{all:unset;cursor:pointer;color:var(--accent);font-size:11px;margin-left:auto}
.testout{margin-top:10px;border:1px solid var(--line);border-radius:10px;background:rgba(10,7,22,.5);padding:12px 14px;font-size:12.5px;color:var(--ts);line-height:1.6;display:none}
.testout.show{display:block}
.testout .ck{color:var(--ok)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:99;background:rgba(40,28,70,.97);color:var(--tp);font-weight:700;font-size:13px;padding:11px 18px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.4);opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.empty{color:var(--tm);font-size:13px;text-align:center;padding:30px}
</style>
</head>
<body>
<div class=&quot;wrap&quot;>
  <header>
    <div class=&quot;logo&quot;>🛠️</div>
    <div>
      <h1>Studio <span style=&quot;color:var(--accent)&quot;>ai-maintainer</span></h1>
      <div class=&quot;sub&quot;>Écrire, tester, gouverner et versionner les recettes &amp;amp; prompts officiels</div>
    </div>
    <div class=&quot;role-pill&quot;>🔒 ai-maintainer · accès restreint</div>
  </header>

  <div class=&quot;nav&quot;>
    <a href=&quot;#&quot; data-go=&quot;catalogue&quot;>🧰 Catalogue</a>
    <a href=&quot;#&quot; class=&quot;on&quot;>🛠️ Studio</a>
    <a href=&quot;#&quot; data-go=&quot;metrics&quot;>📊 Métriques</a>
  </div>

  <p class=&quot;intro&quot;>Le prompt brut n'est <b>jamais</b> exposé aux utilisateurs — il vit ici. Le Studio est le seul endroit où l'on <b>écrit la spécification</b>, où l'on <b>déclare les outils autorisés</b> et les <b>critères de validation</b>, où l'on <b>teste</b> avant publication, et où chaque <b>version</b> est tracée. Réservé au rôle <b>ai-maintainer</b> (Staff AI Enablement).</p>

  <!-- LISTE -->
  <div id=&quot;listView&quot;>
    <div class=&quot;toolbar&quot;>
      <div class=&quot;seg&quot; id=&quot;statusSeg&quot;>
        <button data-st=&quot;&quot; class=&quot;on&quot;>Tout</button>
        <button data-st=&quot;published&quot;>🟢 Publiés</button>
        <button data-st=&quot;review&quot;>🟡 En revue</button>
        <button data-st=&quot;draft&quot;>Brouillons</button>
      </div>
      <button class=&quot;newbtn&quot; id=&quot;newBtn&quot;>＋ Nouvelle recette / prompt</button>
    </div>
    <div class=&quot;list&quot; id=&quot;list&quot;></div>
  </div>

  <!-- EDITEUR -->
  <div class=&quot;editor&quot; id=&quot;editView&quot;></div>
</div>

<div class=&quot;toast&quot; id=&quot;toast&quot;></div>

<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  function esc(s){return String(s==null?'':s).replace(/&amp;/g,'&amp;amp;').replace(/</g,'&amp;lt;').replace(/>/g,'&amp;gt;');}
  function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._x); t._x=setTimeout(function(){t.classList.remove('show');},2300); }
  function vars(b){ var m,re=/\{\{\s*([\wÀ-ÿ][\wÀ-ÿ .-]*?)\s*\}\}/g,seen=[]; while((m=re.exec(b))){var n=m[1].trim(); if(seen.indexOf(n)===-1)seen.push(n);} return seen; }
  function hl(b){ return esc(b).replace(/\{\{\s*([\wÀ-ÿ][\wÀ-ÿ .-]*?)\s*\}\}/g,'<span class=&quot;v&quot;>{{$1}}</span>'); }

  var STATUS_LABEL={published:'Publié',review:'En revue',draft:'Brouillon',deprecated:'Déprécié'};
  var PERM={read:'👁 Lecture',write:'✏️ Écriture',danger:'⛔ Sensible'};

  // ── Données (recettes + prompts gouvernés) ──
  var A=[
    {id:'prep-delivery', kind:'recipe', ic:'🚀', title:'Préparer la livraison en préprod', status:'published', version:5, owner:'Plateforme', updated:'20 mai 2026',
      spec:'Tu orientes une livraison en préproduction. Tu N\'EXÉCUTES PAS les écritures : le module Livraison déterministe le fait après confirmation humaine.\n\nÀ partir du dépôt {{repo}} (stack {{stack}}) :\n1. vérifie que la branche est à jour et mergeable\n2. propose le bump IMAGE_TAG et la synchro des overlays Kustomize\n3. déclenche le scan de vulnérabilités et la vérif des tests\n4. rédige l\'explication des changements pour la MR\n\nRends un plan clair ; rien n\'est écrit sans « ✔ Confirmer ».',
      tools:[['Vérifier la branche','read'],['Bump IMAGE_TAG + overlays','write'],['Scanner vulnérabilités','read'],['Vérifier les tests','read'],['Créer la MR','write']],
      security:['Le LLM oriente ; l\'écriture passe par le module Livraison.','Dry-run obligatoire, confirmation humaine avant toute écriture.'],
      criteria:['Branche à jour et mergeable','Kustomize cohérent avec IMAGE_TAG','Aucune vuln critique','Tests verts'],
      metrics:{uses:480,success:95,humanFix:5,saved:'~30 min'},
      versions:[[5,'20 mai 2026','durcissement du dry-run'],[4,'2 mai 2026','ajout scan vuln'],[3,'12 avr. 2026','overlays Kustomize']]},
    {id:'migrate-java21', kind:'recipe', ic:'🚚', title:'Préparer une migration Spring → Java 21', status:'review', version:2, owner:'Archi', updated:'28 avr. 2026',
      spec:'Prépare une migration vers le JDK {{jdk_cible}} pour un projet Spring Boot.\n\nProduis un plan + une branche avec les changements mécaniques (API dépréciées, records, pattern matching). Écriture UNIQUEMENT sur une branche dédiée, jamais sur main.\n\nCode / contexte :\n{{contexte}}',
      tools:[['Lire le dépôt','read'],['Créer une branche + patch (dry-run)','write']],
      security:['Écriture sur branche dédiée seulement.','Revue humaine obligatoire avant merge.'],
      criteria:['Le projet compile en JDK 21','Aucune API supprimée résiduelle','Tests existants toujours verts'],
      metrics:{uses:56,success:74,humanFix:30,saved:'~2 h'},
      versions:[[2,'28 avr. 2026','pattern matching'],[1,'2 avr. 2026','version initiale']]},
    {id:'tests-junit', kind:'prompt', ic:'🧪', title:'Générer des tests unitaires', status:'published', version:3, owner:'Archi', updated:'12 mai 2026',
      spec:'Écris des tests unitaires en {{langage}} (framework {{framework}}) pour le code ci-dessous.\n\nCouvre le cas nominal, les cas limites, les entrées invalides. Un test par comportement, nommage explicite. Pas de test tautologique.\n\nCode :\n{{code}}',
      tools:[['Lire le dépôt','read'],['Exécuter la suite de tests','read']],
      security:['Lecture seule. Aucun secret transmis au modèle.'],
      criteria:['Les tests compilent','Les tests passent','Couverture de la classe cible > 70 %'],
      metrics:{uses:640,success:88,humanFix:12,saved:'~25 min'},
      versions:[[3,'12 mai 2026','cas limites renforcés'],[2,'20 avr. 2026','nommage'],[1,'1 avr. 2026','initial']]},
    {id:'refacto-legacy', kind:'prompt', ic:'🧹', title:'Refactorer une classe legacy', status:'review', version:1, owner:'Tribu Core', updated:'30 avr. 2026',
      spec:'Propose un refactoring à comportement identique de ce code : extrais les responsabilités, réduis la complexité, garde la signature publique. Propose un diff ciblé, pas une réécriture. Liste les risques.\n\nCode :\n{{code}}',
      tools:[['Lire le dépôt','read'],['Proposer un patch (l\'humain applique)','read']],
      security:['Propose un diff ; n\'écrit rien.'],
      criteria:['Comportement inchangé (tests verts)','Complexité réduite'],
      metrics:{uses:130,success:70,humanFix:35,saved:'~45 min'},
      versions:[[1,'30 avr. 2026','brouillon initial']]},
    {id:'regex-sql', kind:'prompt', ic:'🔤', title:'Générer une regex / une requête SQL', status:'review', version:1, owner:'—', updated:'25 mai 2026',
      spec:'À partir d\'une description en langage naturel, produis une expression régulière ({{saveur}}) OU une requête SQL ({{sgbd}}).\n\nDonne la sortie, une explication token par token, et un cas limite à tester avant usage.\n\nBesoin :\n{{besoin}}',
      tools:[['Aucun (génération de texte)','read']],
      security:['Expérimental — sortie à vérifier avant tout usage en production.'],
      criteria:['Testée sur au moins un exemple par l\'utilisateur','Explication fournie'],
      metrics:{uses:45,success:60,humanFix:40,saved:'~10 min'},
      versions:[[1,'25 mai 2026','brouillon expérimental — réussite faible, à retravailler']]},
    {id:'oncall-summary', kind:'prompt', ic:'🌙', title:'Résumer un incident d\'astreinte', status:'draft', version:1, owner:'marie.d', updated:'aujourd\'hui',
      spec:'À partir des logs et de la timeline, rédige un post-mortem court : impact, cause racine probable, actions correctives. Ton factuel, pas de blâme.\n\nÉléments :\n{{timeline}}',
      tools:[['Aucun (génération de texte)','read']],
      security:['Rappel : caviarder les données sensibles avant de coller.'],
      criteria:['Impact chiffré','Cause plausible','Actions actionnables'],
      metrics:{uses:0,success:0,humanFix:0,saved:'—'},
      versions:[[1,'aujourd\'hui','brouillon']]}
  ];

  var fStatus='';

  function healthFlag(a){ return (a.metrics.uses>20 &amp;&amp; (a.metrics.success<75 || a.metrics.humanFix>30)); }

  function renderList(){
    var list=A.filter(function(a){ return !fStatus || a.status===fStatus; });
    $('list').innerHTML = list.length ? list.map(function(a){
      var flag=healthFlag(a);
      return '<div class=&quot;row&quot; data-id=&quot;'+a.id+'&quot;>'+
        '<span class=&quot;ic&quot;>'+a.ic+'</span>'+
        '<div class=&quot;main&quot;><div class=&quot;ti&quot;>'+esc(a.title)+'</div>'+
          '<div class=&quot;meta&quot;>'+esc(a.owner)+' · v'+a.version+' · maj '+a.updated+' · '+vars(a.spec).length+' variables'+(a.kind==='recipe'?' · '+a.tools.length+' outils':'')+'</div></div>'+
        '<span class=&quot;kind '+a.kind+'&quot;>'+(a.kind==='recipe'?'⚙️ recette':'💬 prompt')+'</span>'+
        '<span class=&quot;status '+a.status+'&quot;>'+STATUS_LABEL[a.status]+'</span>'+
        '<div class=&quot;health&quot;>'+(a.metrics.uses?('<b>'+a.metrics.success+'%</b> réussite'+(flag?'<br><span class=&quot;flag&quot;>⚠ à améliorer</span>':'')):'<span style=&quot;color:var(--tm)&quot;>jamais utilisé</span>')+'</div>'+
      '</div>';
    }).join('') : '<div class=&quot;empty&quot;>Rien dans ce statut.</div>';
    $('list').querySelectorAll('.row').forEach(function(el){ el.addEventListener('click',function(){ openEditor(el.dataset.id); }); });
  }

  // ── Éditeur ──
  var cur=null;
  function openEditor(id){
    cur=A.find(function(x){return x.id===id;}); if(!cur) return;
    $('listView').style.display='none'; $('editView').classList.add('show');
    var a=cur;
    var steps=['draft','review','published'];
    var si=steps.indexOf(a.status==='deprecated'?'published':a.status);
    var govSteps=[['Brouillon',0],['En revue',1],['Publié (officiel)',2]].map(function(s){
      var cls=s[1]<si?'done':s[1]===si?'cur':''; return '<div class=&quot;step '+cls+'&quot;><span class=&quot;dot&quot;></span>'+s[0]+'</div>';
    }).join('');
    var govBtns = a.status==='draft'
        ? '<button class=&quot;gb go&quot; data-act=&quot;review&quot;>Soumettre à revue →</button>'
      : a.status==='review'
        ? '<button class=&quot;gb go&quot; data-act=&quot;publish&quot;>🟢 Publier (officiel)</button><button class=&quot;gb ghost&quot; data-act=&quot;draft&quot;>← Renvoyer en brouillon</button>'
      : '<button class=&quot;gb go&quot; data-act=&quot;version&quot;>＋ Publier une nouvelle version</button><button class=&quot;gb warn&quot; data-act=&quot;deprecate&quot;>Déprécier</button>';

    $('editView').innerHTML =
      '<button class=&quot;back&quot; id=&quot;backBtn&quot;>← Retour à la liste</button>'+
      '<div class=&quot;ehead&quot;><span class=&quot;ic&quot;>'+a.ic+'</span><div style=&quot;flex:1&quot;><h2>'+esc(a.title)+'</h2>'+
        '<div class=&quot;sub&quot;><span class=&quot;kind '+a.kind+'&quot;>'+(a.kind==='recipe'?'⚙️ recette':'💬 prompt')+'</span><span class=&quot;status '+a.status+'&quot;>'+STATUS_LABEL[a.status]+'</span> · v'+a.version+' · '+esc(a.owner)+'</div></div></div>'+
      '<div class=&quot;grid2&quot;><div>'+
        '<div class=&quot;panel&quot;><div class=&quot;pl&quot;>🎯 Intention <span class=&quot;hint&quot;>— ce que voit l\'utilisateur</span></div><input class=&quot;tin&quot; id=&quot;e_title&quot; value=&quot;'+esc(a.title)+'&quot;></div>'+
        '<div class=&quot;panel&quot;><div class=&quot;pl&quot;>📄 Prompt / spécification <span class=&quot;hint&quot;>— masqué aux utilisateurs, éditable ici</span></div>'+
          '<textarea class=&quot;tin&quot; id=&quot;e_spec&quot;>'+esc(a.spec)+'</textarea>'+
          '<div class=&quot;detected&quot; id=&quot;e_detected&quot;></div></div>'+
        (a.kind==='recipe'?
        '<div class=&quot;panel&quot;><div class=&quot;pl&quot;>🛠 Outils autorisés (allowlist) <span class=&quot;hint&quot;>— appliquée à l\'exécution</span></div><div id=&quot;e_tools&quot;>'+
          a.tools.map(function(t,i){ return '<div class=&quot;toolrow&quot;><span class=&quot;tn&quot;>'+esc(t[0])+'</span>'+
            '<select class=&quot;tin&quot; data-tool=&quot;'+i+'&quot;>'+Object.keys(PERM).map(function(k){return '<option value=&quot;'+k+'&quot;'+(t[1]===k?' selected':'')+'>'+PERM[k]+'</option>';}).join('')+'</select></div>'; }).join('')+
          '</div><div class=&quot;mini&quot;>Une recette ne peut jamais faire plus que son allowlist. Toute action <span class=&quot;perm-write&quot;>✏️ écriture</span> exige une confirmation humaine (dry-run).</div></div>' : '')+
        '<div class=&quot;panel&quot;><div class=&quot;pl&quot;>🔒 Règles de sécurité</div><div id=&quot;e_sec&quot;>'+
          a.security.map(function(s,i){return '<div class=&quot;crit&quot;><span>🔒</span><span>'+esc(s)+'</span><button class=&quot;del&quot; data-delsec=&quot;'+i+'&quot;>✕</button></div>';}).join('')+'</div>'+
          '<div class=&quot;addline&quot;><input class=&quot;tin&quot; id=&quot;e_secnew&quot; placeholder=&quot;ajouter une règle…&quot;><button id=&quot;e_secadd&quot;>Ajouter</button></div></div>'+
        '<div class=&quot;panel&quot;><div class=&quot;pl&quot;>✅ Critères de validation <span class=&quot;hint&quot;>— vérifiés après exécution</span></div><div id=&quot;e_crit&quot;>'+
          a.criteria.map(function(c,i){return '<div class=&quot;crit&quot;><span>☑</span><span>'+esc(c)+'</span><button class=&quot;del&quot; data-delcrit=&quot;'+i+'&quot;>✕</button></div>';}).join('')+'</div>'+
          '<div class=&quot;addline&quot;><input class=&quot;tin&quot; id=&quot;e_critnew&quot; placeholder=&quot;ajouter un critère vérifiable…&quot;><button id=&quot;e_critadd&quot;>Ajouter</button></div></div>'+
        '<div class=&quot;panel&quot;><div class=&quot;pl&quot;>🧪 Banc d\'essai <span class=&quot;hint&quot;>— tester avant de publier</span></div>'+
          '<textarea class=&quot;tin&quot; id=&quot;e_sample&quot; style=&quot;min-height:80px&quot; placeholder=&quot;colle un exemple d\'entrée (code, diff, story…)&quot;></textarea>'+
          '<div class=&quot;addline&quot;><button id=&quot;e_run&quot; style=&quot;background:rgba(124,92,252,.15);border-color:var(--accent);color:var(--tp)&quot;>▶ Tester (simulation)</button></div>'+
          '<div class=&quot;testout&quot; id=&quot;e_testout&quot;></div></div>'+
      '</div><div>'+
        '<div class=&quot;panel gov&quot;><div class=&quot;pl&quot;>🚦 Gouvernance</div>'+govSteps+'<div class=&quot;govbtns&quot;>'+govBtns+'</div>'+
          '<div class=&quot;mini&quot;>Seul un <b>ai-maintainer</b> peut publier. La publication rend la recette visible dans le catalogue en niveau <b>Officiel</b>.</div></div>'+
        '<div class=&quot;panel&quot;><div class=&quot;pl&quot;>📊 Métriques (lecture seule)</div>'+
          '<div class=&quot;metric&quot;><span>Usages</span><b>'+a.metrics.uses+'</b></div>'+
          '<div class=&quot;metric&quot;><span>Réussite</span><b style=&quot;color:'+(a.metrics.success>=85?'var(--ok)':a.metrics.success>=70?'var(--warn)':'var(--err)')+'&quot;>'+a.metrics.success+'%</b></div>'+
          '<div class=&quot;metric&quot;><span>Corrigés à la main</span><b>'+a.metrics.humanFix+'%</b></div>'+
          '<div class=&quot;metric&quot;><span>Temps gagné (est.)</span><b>'+a.metrics.saved+'</b></div>'+
          (healthFlag(a)?'<div class=&quot;mini&quot; style=&quot;color:var(--warn)&quot;>⚠ Réussite basse / corrections fréquentes → candidate à une nouvelle version.</div>':'')+'</div>'+
        '<div class=&quot;panel&quot;><div class=&quot;pl&quot;>🕘 Versions</div><div id=&quot;e_vers&quot;>'+
          a.versions.map(function(v,i){return '<div class=&quot;ver&quot;><span class=&quot;vn&quot;>v'+v[0]+'</span><span class=&quot;vd&quot;>'+esc(v[1])+' — '+esc(v[2])+'</span>'+(i>0?'<button class=&quot;rb&quot; data-roll=&quot;'+v[0]+'&quot;>rollback</button>':'')+'</div>';}).join('')+'</div></div>'+
      '</div></div>';

    // wiring
    $('backBtn').addEventListener('click',backToList);
    function detect(){ var vs=vars($('e_spec').value); $('e_detected').innerHTML=vs.length?'Variables : '+vs.map(function(v){return '<span class=&quot;v&quot;>{{'+esc(v)+'}}</span>';}).join(', '):'<span style=&quot;color:var(--tm)&quot;>Aucune variable.</span>'; }
    $('e_spec').addEventListener('input',detect); detect();
    // tools
    $('editView').querySelectorAll('[data-tool]').forEach(function(s){ s.addEventListener('change',function(){ a.tools[+s.dataset.tool][1]=s.value; toast('Permission mise à jour (brouillon local)'); }); });
    // security add/del
    $('e_secadd')&amp;&amp;$('e_secadd').addEventListener('click',function(){ var v=$('e_secnew').value.trim(); if(!v)return; a.security.push(v); openEditor(a.id); });
    $('editView').querySelectorAll('[data-delsec]').forEach(function(b){ b.addEventListener('click',function(){ a.security.splice(+b.dataset.delsec,1); openEditor(a.id); }); });
    // criteria add/del
    $('e_critadd').addEventListener('click',function(){ var v=$('e_critnew').value.trim(); if(!v)return; a.criteria.push(v); openEditor(a.id); });
    $('editView').querySelectorAll('[data-delcrit]').forEach(function(b){ b.addEventListener('click',function(){ a.criteria.splice(+b.dataset.delcrit,1); openEditor(a.id); }); });
    // title/spec persist on the fly
    $('e_title').addEventListener('input',function(){ a.title=$('e_title').value; });
    $('e_spec').addEventListener('input',function(){ a.spec=$('e_spec').value; });
    // test bench
    $('e_run').addEventListener('click',function(){
      var s=$('e_sample').value.trim();
      var out=$('e_testout'); out.classList.add('show');
      out.innerHTML='<div style=&quot;color:var(--tp);font-weight:700;margin-bottom:6px&quot;>Sortie simulée (maquette)</div>'+
        (s?'Le prompt a été appliqué à ton exemple avec le contexte injecté.':'<span style=&quot;color:var(--warn)&quot;>Astuce : colle un exemple pour un test plus réaliste.</span>')+
        '<div style=&quot;margin-top:9px;border-top:1px solid var(--line);padding-top:8px&quot;>Vérification automatique des critères :</div>'+
        a.criteria.map(function(c){return '<div style=&quot;margin-top:4px&quot;><span class=&quot;ck&quot;>✓</span> '+esc(c)+'</div>';}).join('')+
        '<div class=&quot;mini&quot;>En vrai : la recette tournerait en dry-run contre l\'exemple, puis les critères seraient évalués avant tout OK.</div>';
      toast('🧪 Test simulé — critères passés');
    });
    // rollback
    $('editView').querySelectorAll('[data-roll]').forEach(function(b){ b.addEventListener('click',function(){ toast('↩ Rollback vers v'+b.dataset.roll+' (simulation)'); }); });
    // governance
    $('editView').querySelectorAll('[data-act]').forEach(function(b){ b.addEventListener('click',function(){ gov(a,b.dataset.act); }); });
  }

  function gov(a,act){
    if(act==='review'){ a.status='review'; toast('🟡 Soumis à revue'); }
    else if(act==='draft'){ a.status='draft'; toast('Renvoyé en brouillon'); }
    else if(act==='publish'){ a.status='published'; a.updated='aujourd\'hui'; toast('🟢 Publié en Officiel — visible dans le catalogue'); }
    else if(act==='deprecate'){ a.status='deprecated'; toast('Recette dépréciée'); }

    area+='L'+xs(7)+' '+H+' Z';
    var dots=pts.map(function(v,i){return '<circle class=&quot;dot&quot; cx=&quot;'+xs(i).toFixed(1)+'&quot; cy=&quot;'+ys(v).toFixed(1)+'&quot; r=&quot;3&quot;/>';}).join('');
    var glines=[0,.5,1].map(function(f){var y=pad+f*(H-2*pad);return '<line class=&quot;grid-l&quot; x1=&quot;0&quot; y1=&quot;'+y+'&quot; x2=&quot;'+W+'&quot; y2=&quot;'+y+'&quot;/>';}).join('');
    $('trend').innerHTML='<defs><linearGradient id=&quot;g&quot; x1=&quot;0&quot; y1=&quot;0&quot; x2=&quot;0&quot; y2=&quot;1&quot;><stop offset=&quot;0&quot; stop-color=&quot;#2dd4bf&quot; stop-opacity=&quot;.45&quot;/><stop offset=&quot;1&quot; stop-color=&quot;#2dd4bf&quot; stop-opacity=&quot;0&quot;/></linearGradient></defs>'+glines+'<path class=&quot;area&quot; d=&quot;'+area+'&quot;/><path class=&quot;ln&quot; d=&quot;'+d+'&quot;/>'+dots;
    $('xlab').innerHTML=['S-7','S-6','S-5','S-4','S-3','S-2','S-1','Cette sem.'].map(function(l){return '<span>'+l+'</span>';}).join('');

    // Donut par niveau
    var byLvl={off:0,team:0,exp:0}; items.forEach(function(i){ byLvl[i.lvl]+=i.u; });
    var tot=byLvl.off+byLvl.team+byLvl.exp, off=0, seg='';
    ['off','team','exp'].forEach(function(k){ var pct=byLvl[k]/tot*100; seg+='<circle r=&quot;15.915&quot; cx=&quot;21&quot; cy=&quot;21&quot; fill=&quot;transparent&quot; stroke=&quot;'+LVL[k][1]+'&quot; stroke-width=&quot;6&quot; stroke-dasharray=&quot;'+pct.toFixed(1)+' '+(100-pct).toFixed(1)+'&quot; stroke-dashoffset=&quot;'+(25-off).toFixed(1)+'&quot;/>'; off+=pct; });
    $('donut').innerHTML='<circle r=&quot;15.915&quot; cx=&quot;21&quot; cy=&quot;21&quot; fill=&quot;transparent&quot; stroke=&quot;rgba(255,255,255,.05)&quot; stroke-width=&quot;6&quot;/>'+seg+'<text x=&quot;21&quot; y=&quot;20.5&quot; text-anchor=&quot;middle&quot; font-size=&quot;6.5&quot; fill=&quot;#f5f1ff&quot; font-weight=&quot;800&quot; font-family=&quot;Bricolage Grotesque&quot;>'+fmt(tot)+'</text><text x=&quot;21&quot; y=&quot;26&quot; text-anchor=&quot;middle&quot; font-size=&quot;3.2&quot; fill=&quot;#7a6fa3&quot; font-family=&quot;Manrope&quot;>usages</text>';
    $('donutLeg').innerHTML=['off','team','exp'].map(function(k){ return '<div class=&quot;li&quot;><span class=&quot;sw&quot; style=&quot;background:'+LVL[k][1]+'&quot;></span>'+LVL[k][0]+' · <b>'+Math.round(byLvl[k]/tot*100)+'%</b></div>'; }).join('');

    // Top usage
    var top=items.slice().sort(function(a,b){return b.u-a.u;}).slice(0,7);
    var mx=top[0].u;
    $('topUse').innerHTML=top.map(function(i){ return '<div class=&quot;bar&quot;><span class=&quot;lbl&quot;>'+i.ic+' '+esc(i.name)+'</span><div class=&quot;track&quot;><div class=&quot;fill&quot; style=&quot;width:'+(i.u/mx*100).toFixed(0)+'%&quot;></div></div><span class=&quot;num&quot;>'+fmt(i.u)+'</span></div>'; }).join('');

    // Success bars (sorted asc to surface weak ones)
    var bysucc=items.slice().sort(function(a,b){return a.success-b.success;}).slice(0,7);
    $('successBars').innerHTML=bysucc.map(function(i){ var cls=i.success>=85?'ok':i.success>=70?'warn':'err'; return '<div class=&quot;bar&quot;><span class=&quot;lbl&quot;>'+i.ic+' '+esc(i.name)+'</span><div class=&quot;track&quot;><div class=&quot;fill '+cls+'&quot; style=&quot;width:'+i.success+'%&quot;></div></div><span class=&quot;num&quot;>'+i.success+'%</span></div>'; }).join('');

    // À améliorer
    var flagged=items.filter(function(i){return i.u>10 &amp;&amp; (i.success<75||i.humanFix>30);}).sort(function(a,b){return a.success-b.success;});
    $('improve').innerHTML=flagged.length?flagged.map(function(i){
      var why=i.success<75?('réussite '+i.success+'%'):('corrigés '+i.humanFix+'%');
      return '<div class=&quot;it&quot;><span class=&quot;ic&quot;>'+i.ic+'</span><div class=&quot;mn&quot;><div class=&quot;mt&quot;>'+esc(i.name)+'</div><div class=&quot;ms&quot;>⚠ '+why+' — candidate à une nouvelle version</div></div>'+
        '<span class=&quot;why&quot;>'+i.success+'% · '+i.humanFix+'% corr.</span>'+
        '<button class=&quot;lnk&quot; data-studio=&quot;'+esc(i.studio||'')+'&quot;>Ouvrir dans le Studio →</button></div>';
    }).join(''):'<div style=&quot;color:var(--tm);font-size:13px;padding:10px&quot;>Rien à signaler sur cette période 🎉</div>';
    $('improve').querySelectorAll('[data-studio]').forEach(function(b){ b.addEventListener('click',function(){ var s=b.dataset.studio; parent.postMessage({go:'studio',hash:(s||'')},'*'); }); });

    renderCosts(items);
  }

  function renderCosts(items){
    var totalUses=0, totalCost=0, totalOptimal=0, totalSuccess=0, wasted=0, wastedCost=0, reworkNum=0;
    items.forEach(function(i){
      var c=MODELS[i.model].c, oc=MODELS[i.optimal].c;
      i._cost=i.u*c; i._opt=i.u*oc;
      totalUses+=i.u; totalCost+=i._cost; totalOptimal+=i._opt;
      totalSuccess+=i.u*i.success/100;
      reworkNum+=i.u*i.humanFix/100;
      var w=i.u*(1-i.success/100); wasted+=w; wastedCost+=w*c;
    });
    var costPerExec=totalCost/totalUses, costPerSuccess=totalCost/totalSuccess;
    var reworkPct=Math.round(reworkNum/totalUses*100);
    var potential=totalCost-totalOptimal;
    // KPIs coût
    $('costKpis').innerHTML=[
      ['💶','Coût total (période)',eur(totalCost),'','budget IA consommé'],
      ['⚙️','Coût / exécution',eur(costPerExec),'','moyenne tous modèles'],
      ['🎯','Coût / résultat réussi',eur(costPerSuccess),'up','on paie aussi les échecs'],
      ['🖐','Reprise humaine',reworkPct+'%','down','résultats retravaillés'],
      ['🗑','Appels inutiles',fmt(wasted),'down',eur(wastedCost)+' gaspillés (échecs)']
    ].map(function(k){ return '<div class=&quot;kpi&quot;><div class=&quot;k&quot;>'+k[0]+' '+k[1]+'</div><div class=&quot;val&quot;>'+k[2]+'</div><div class=&quot;tr '+k[3]+'&quot;>'+(k[3]==='up'?'▲ ':k[3]==='down'?'▼ ':'')+k[4]+'</div></div>'; }).join('');
    // Coût par équipe
    var teams={}; items.forEach(function(i){ if(!teams[i.team])teams[i.team]={cost:0,uses:0,rew:0}; teams[i.team].cost+=i._cost; teams[i.team].uses+=i.u; teams[i.team].rew+=i.u*i.humanFix/100; });
    var tarr=Object.keys(teams).map(function(t){return {t:t,cost:teams[t].cost,rew:Math.round(teams[t].rew/teams[t].uses*100)};});
    var tmax=Math.max.apply(null,tarr.map(function(x){return x.cost;}));
    $('teamCost').innerHTML=tarr.sort(function(a,b){return b.cost-a.cost;}).map(function(x){ return '<div class=&quot;bar&quot;><span class=&quot;lbl&quot;>'+esc(x.t)+'</span><div class=&quot;track&quot;><div class=&quot;fill&quot; style=&quot;width:'+(x.cost/tmax*100).toFixed(0)+'%&quot;></div></div><span class=&quot;num&quot;>'+eur(x.cost)+'</span></div>'; }).join('');
    $('teamRework').innerHTML=tarr.slice().sort(function(a,b){return b.rew-a.rew;}).map(function(x){ var cls=x.rew<=15?'ok':x.rew<=25?'warn':'err'; return '<div class=&quot;bar&quot;><span class=&quot;lbl&quot;>'+esc(x.t)+'</span><div class=&quot;track&quot;><div class=&quot;fill '+cls+'&quot; style=&quot;width:'+x.rew+'%&quot;></div></div><span class=&quot;num&quot;>'+x.rew+'%</span></div>'; }).join('');
    // Modèle optimal par tâche
    if(potential>0.5) $('modelSaving').innerHTML='<div class=&quot;savecallout&quot;>💡 Aligner chaque tâche sur son modèle optimal : <b>−'+eur(potential)+'</b> sur la période (<b>−'+Math.round(potential/totalCost*100)+'%</b>) sans perte de qualité. Un clic ajuste le modèle dans le Studio.</div>';
    else $('modelSaving').innerHTML='';
    var rows=items.slice().sort(function(a,b){return (b._cost-b._opt)-(a._cost-a._opt);});
    $('modelTable').innerHTML='<div class=&quot;mrow head&quot;><span>Tâche</span><span>Actuel</span><span></span><span>Recommandé</span></div>'+
      rows.map(function(i){ var save=i._cost-i._opt; var same=i.model===i.optimal;
        return '<div class=&quot;mrow&quot;><span class=&quot;tk&quot;>'+i.ic+' '+esc(i.name)+'</span>'+
          '<span><span class=&quot;mtag m-'+i.model+'&quot;>'+MODELS[i.model].n+'</span></span>'+
          '<span class=&quot;arr&quot;>'+(same?'=':'→')+'</span>'+
          '<span><span class=&quot;mtag m-'+i.optimal+'&quot;>'+MODELS[i.optimal].n+'</span> <span class=&quot;save '+(save>0.5?'pos':'zero')+'&quot;>'+(save>0.5?'−'+eur(save):'ok')+'</span></span></div>';
      }).join('');
  }

  var days=30;
  $('period').querySelectorAll('[data-p]').forEach(function(b){ b.addEventListener('click',function(){ days=+b.dataset.p; $('period').querySelectorAll('button').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); render(days); }); });
  render(days);
})();
</script>

 <script>
   function go(name,hash){
     document.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.t===name);});
     document.querySelectorAll('.frames iframe').forEach(function(f){f.classList.toggle('on',f.id==='f-'+name);});
     if(hash){ var f=document.getElementById('f-'+name); try{ f.contentWindow.location.hash=hash; }catch(e){} }
   }
   document.querySelectorAll('.tabs button').forEach(function(b){b.addEventListener('click',function(){go(b.dataset.t);});});
   window.addEventListener('message',function(e){ if(e.data&&e.data.go) go(e.data.go, e.data.hash?('#'+e.data.hash):''); });
 </script>
